services:
  db:
    image: mysql:8.0
    container_name: doble_cinco_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: doble_cinco
    ports:
      - "3307:3306"
    volumes:
      - doble_cinco_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  doble_cinco_data: