<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Esta página trata de gestión de un complejo de fútbol, permite reservar canchas, buscar partidos y organizar equipos">
  <link rel="icon" href="../IMAGENES/LOGO PÁGINA.png" type="image/png">
  <link rel="stylesheet" href="../CSS/index.css">
  <script type="module" src="../src/main.jsx"></script>
  <title>Mi cuenta</title>
</head>

<body>
  <div id="root" data-titulo="MI CUENTA"> </div>

  <div class="main">
    <div class="div_formulario">
      <h2 class="subtitulo_datos">Mis datos</h2>
        <form class="formulario_cuenta">
          <label for="nombre" class="label_form">Nombre</label>
            <input type="text" placeholder="Juan" required id="nombre" class="input_form">
          <label for="apellido" class="label_form">Apellido</label>
            <input type="text" placeholder="Pérez" required id="apellido" class="input_form">
          <label for="email" class="label_form">Email</label>
            <input type="email" placeholder="juan.perez@ejemplo.com" class="input_form">
          <label for="fecha_nac" class="label_form">Fecha Nacimiento</label>
            <input type="date" id="fecha_nac" class="input_form">
          <label for="telefono" class="label_form">Número telefono</label>
            <input type="tel" placeholder="3413032023" id="telefono" class="input_form">
          <label for="descripcion" class="label_form">Descripcion</label>
            <input type="text" placeholder="Juego de cinco" class="input_form">
          <label for="genero" class="label_form">Género</label>
            <input type="text" placeholder="Hombre/Mujer" class="input_form">
          <label for="dni" class="label_form">DNI</label>
            <input type="text" placeholder="XXXXXXXX" class="input_form">
        </form>
    </div>
  </div>
</body>

</html>
